# ==============================================================================
# CloudCost AI - Docker Compose Multi-Service Stack
# Orchestrates: PostgreSQL (pgvector), Redis 7, FastAPI Backend,
#               Celery Worker, and Next.js 16 Frontend
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database with native pgvector extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cloudcost_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cloudcost_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-cloudcost_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cloudcost_network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 In-Memory Cache, Message Broker & Pub/Sub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cloudcost_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 2s
    networks:
      - cloudcost_network

  # ----------------------------------------------------------------------------
  # 3. FastAPI Backend REST & WebSocket Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudcost_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Internal Docker container-to-container network URLs:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cloudcost_ai}"
      REDIS_URL: "redis://redis:6379/0"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cloudcost-ai-super-secret-jwt-signing-key-32chars}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: "gpt-4o-mini"
      EMBEDDING_MODEL: "text-embedding-3-small"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudcost_network

  # ----------------------------------------------------------------------------
  # 4. Celery Asynchronous Background Task Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: cloudcost_worker
    restart: unless-stopped
    environment:
      # Internal Docker container-to-container network URLs:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cloudcost_ai}"
      REDIS_URL: "redis://redis:6379/0"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: "gpt-4o-mini"
      EMBEDDING_MODEL: "text-embedding-3-small"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - cloudcost_network

  # ----------------------------------------------------------------------------
  # 5. Next.js 16 Frontend Web Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-reachable URL for client-side API requests:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: cloudcost_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_started
    networks:
      - cloudcost_network

# ------------------------------------------------------------------------------
# Persistent Named Volumes (Ensures database and Redis data persist across restarts)
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: cloudcost_postgres_data
  redis_data:
    name: cloudcost_redis_data

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  cloudcost_network:
    name: cloudcost_network
    driver: bridge

