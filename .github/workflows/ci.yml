# ==============================================================================
# CloudCost AI - Continuous Integration (CI) Workflow
# Automatically validates Frontend, Backend, and Docker configurations on
# Pushes and Pull Requests targeting main or master branches.
# ==============================================================================

name: CloudCost AI CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# Principle of Least Privilege: workflow only requires repository read access
permissions:
  contents: read

# Cancel redundant in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Frontend Quality & Production Build Validation
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run ESLint Checks
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1

  # ----------------------------------------------------------------------------
  # Job 2: Backend Integration Testing (PostgreSQL w/ pgvector & Redis)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Pytest & Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Service containers provision real PostgreSQL 16 (pgvector) and Redis 7
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudcost_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cloudcost_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        run: PYTHONPATH=. pytest -v
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloudcost_ai
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-jwt-secret-key-min-32-chars-strictly-for-testing
          ENVIRONMENT: test
          OPENAI_API_KEY: sk-placeholder-ci

  # ----------------------------------------------------------------------------
  # Job 3: Dockerfiles & Docker Compose Configuration Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker & Compose Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose File Syntax
        run: docker compose config

      - name: Validate Backend Dockerfile Build
        run: docker build -t cloudcost-backend-check ./backend

      - name: Validate Worker Dockerfile Build
        run: docker build -t cloudcost-worker-check -f ./backend/Dockerfile.worker ./backend

